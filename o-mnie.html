<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O mnie — asiaf kornelia</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <meta name="description" content="Poznaj asiaf_kornelia — kilka słów o tym, co tworzę i gdzie mnie znaleźć." />
  </head>
  <body class="about-page">
    <div class="scene">
      <div class="static-noise"></div>
      <div class="paper-fibers"></div>
      <div class="hair-particles"></div>
      <div class="tear left"></div>
      <div class="tear right"></div>
      <div class="blobs blob-left"></div>
      <a href="https://sklepik.asiaf.net/" class="asset-link asset-shop" aria-label="Przejdź do sklepu">
        <img src="graphics/miś stan 1.png" alt="" class="asset-state asset-state-base" />
        <img src="graphics/miś stan 2.png" alt="" class="asset-state asset-state-hover" />
      </a>
      <a href="mailto:hi@asiaf.net" class="asset-link asset-contact" aria-label="Napisz wiadomość">
        <img src="graphics/telefon stan 1.png" alt="" class="asset-state asset-state-base" />
        <img src="graphics/telefon stan 2.png" alt="" class="asset-state asset-state-hover" />
      </a>
      <main class="about-main">
        <h1>o mnie</h1>
        <p class="bio">Hej, tu Asia.</p>
        <a href="index.html" class="back-link" aria-label="Wróć na stronę główną">wróć na stronę główną</a>
      </main>
      <footer>© 2026 asiaf kornelia</footer>
    </div>
    <script>
      (function () {
        const isTouch = window.matchMedia("(hover: none), (pointer: coarse)").matches || "ontouchstart" in window;
        const touchAssets = document.querySelectorAll(".asset-link");
        const entranceAssets = document.querySelectorAll(".asset-shop, .asset-contact");
        if (isTouch) {
          document.body.classList.add("is-touch");
        }
        entranceAssets.forEach((asset) => {
          asset.classList.add("asset-animating");
          asset.addEventListener("animationend", () => {
            asset.classList.remove("asset-animating");
          }, { once: true });
        });
        if (isTouch) {
          touchAssets.forEach((asset) => {
            asset.addEventListener("click", () => asset.classList.add("touch-hover"), { once: true });
          });
        }
      })();
    </script>
  </body>
</html>
